name: Collect policy documents
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        type: choice
        options: [incremental, backfill]
        default: incremental
        required: true
      batch_size:
        description: 'Maximum unique details (0 = all pending)'
        type: string
        default: '100'
        required: true
      since:
        description: 'Backfill boundary (YYYY-MM-DD)'
        type: string
        default: '2025-10-01'
        required: true
permissions:
  contents: write
concurrency:
  group: policy-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install and verify
        run: |
          python -m pip install -r requirements-collector.txt
          python -m unittest discover -s tests -v
      - name: Collect
        timeout-minutes: 100
        env:
          MODE: ${{ inputs.mode }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SINCE: ${{ inputs.since }}
          PYTHONIOENCODING: utf-8
        run: python -m collector --mode "$MODE" --batch-size "$BATCH_SIZE" --since "$SINCE"
      - name: Save collected data and checkpoints
        if: always()
        run: |
          if [ -d data ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "Update collected policy data and run status"
              git pull --rebase
              git push
            fi
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: collection-reports
          path: |
            data/runs/
            data/status/
            data/logs/
          if-no-files-found: warn
