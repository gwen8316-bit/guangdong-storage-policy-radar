name: Analyze three policy samples
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: policy-collection
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-collector.txt
      - run: python -m unittest discover -s tests -p test_analysis.py -v
      - name: Analyze exactly three configured samples
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m analysis --sample
      - name: Save results and budget ledger
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Save three policy AI samples and keyword results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ai-samples
          path: |
            data/analysis/
            data/analysis-summary.json
            data/state/ai-budget.json
