name: Source connectivity check
on:
  workflow_dispatch:
    inputs:
      attempts:
        description: 'Rounds per source (1 to 5)'
        required: true
        default: '3'
        type: choice
        options: ['1', '2', '3', '4', '5']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe sources
        env:
          ATTEMPTS: ${{ inputs.attempts }}
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements-connectivity.txt
          python scripts/check_connectivity.py --attempts "$ATTEMPTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectivity-report
          path: reports/connectivity.json
          if-no-files-found: warn
